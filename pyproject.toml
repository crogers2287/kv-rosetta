[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kv-rosetta"
version = "0.1.0"
description = "Portable cross-model, cross-runtime KV cache exchange"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]
license = {text = "Apache-2.0"}

[project.scripts]
kv-rosetta = "kv_rosetta.cli:main"

[tool.setuptools.packages.find]
include = ["kv_rosetta*"]
